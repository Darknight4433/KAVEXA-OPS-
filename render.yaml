services:
  # Static Site for KAVEXA OPS Dashboard & Mobile Web
  - type: web
    name: kavexa-ops-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.15.0

  # Backend API Server (Optional Node service)
  - type: web
    name: kavexa-ops-api
    runtime: node
    plan: free
    buildCommand: npm install && npm --workspace=server run build
    startCommand: npm --workspace=server start
    envVars:
      - key: NODE_ENV
        value: production
